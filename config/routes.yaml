index:
    path: /
    controller: App\Controller\Site\NewsController::index

app_logout:
    path: /logout
    methods: GET

app_login:
    path: /login
    methods: GET
    controller: App\Controller\SecurityController::login

cognito_callback:
    path: /auth/cognito/callback
    methods: GET
    controller: App\Controller\SecurityController::cognitoCallback