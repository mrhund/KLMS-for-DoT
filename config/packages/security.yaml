security:
    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        # used to reload user from session & other features (e.g. switch_user)
        app_user_provider:
            id: App\Security\UserProvider
    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        assets:
            pattern: ^/(media|images|cache|build)/
            security: false
        mcp:
            pattern: ^/mcp
            stateless: true
            provider: app_user_provider
            access_token:
                token_handler:
                    id: App\Security\ApiTokenHandler
        main:
            lazy: true
            provider: app_user_provider
            custom_authenticator:
                - App\Security\CognitoAuthenticator
            logout:
                path: '/logout'
            entry_point: App\Security\CognitoAuthenticator

            # activate different ways to authenticate
            # https://symfony.com/doc/current/security.html#the-firewall

            # https://symfony.com/doc/current/security/impersonating_user.html
            # switch_user: true

    # IsGranted attribute can't perform "or" without an extra bundle anymore, therefore, create a new role for media access
    role_hierarchy:
        ROLE_ADMIN_CONTENT: ROLE_ADMIN_MEDIA
        ROLE_ADMIN_NEWS: ROLE_ADMIN_MEDIA

    # Easy way to control access for large sections of your site
    # Note: Only the *first* access control that matches will be used
    access_control:
        - { path: ^/mcp, roles: ROLE_ADMIN }
        - { path: ^/login, roles: PUBLIC_ACCESS}
        - { path: ^/auth/cognito/callback, roles: PUBLIC_ACCESS}
        - { path: ^/api, roles: IS_AUTHENTICATED_REMEMBERED}
        - { path: ^/admin, roles: ROLE_ADMIN }
        # - { path: ^/, roles: ROLE_USER }
        # - { path: ^/profile, roles: ROLE_USER }
